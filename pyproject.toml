[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "punkasgi"
dynamic = ["version"]
description = "An ASGI server for the tonio runtime, built on httpunk"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.14"

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

keywords = ["asgi", "async", "http", "server", "httpunk", "tonio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "click>=7.0",
    "httpunk~=0.4.2",
    "tonio~=0.9.17",
    "websockets>=17",
]

[project.optional-dependencies]
standard = [
    "python-dotenv>=0.13",
    "PyYAML>=5.1",
]

[dependency-groups]
lint = [
    "ruff~=0.15.0",
]
test = [
    "punkreq~=0.2.1",
    "pytest>=8.3",
    "trustme>=1.2.1",
]

[project.scripts]
punkasgi = "punkasgi.main:main"

[project.urls]
Homepage = 'https://github.com/gi0baro/punkasgi'
Funding = 'https://github.com/sponsors/gi0baro'
Source = 'https://github.com/gi0baro/punkasgi'
Issues = 'https://github.com/gi0baro/punkasgi/issues'

[tool.hatch.version]
path = "punkasgi/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    '/README.md',
    '/LICENSE',
    '/punkasgi',
    '/tests',
]

[tool.pytest.ini_options]
addopts = "-rxXs --strict-config --strict-markers"
tonio_mode = "auto"
xfail_strict = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = 'double'

[tool.ruff.lint]
extend-select = [
    # E and F are enabled by default
    'B',      # flake8-bugbear
    'C4',     # flake8-comprehensions
    'C90',    # mccabe
    'I',      # isort
    'N',      # pep8-naming
    'Q',      # flake8-quotes
    'RUF100', # ruff (unused noqa)
    'S',      # flake8-bandit
    'W',      # pycodestyle
]
extend-ignore = [
    'B006', # mutable function args are fine
    'B008', # function calls in args defaults are fine
    'B009', # getattr with constants is fine
    'B034', # re.split won't confuse us
    'B904', # rising without from is fine
    'E731', # assigning lambdas is fine
    'F403', # import * is fine
    'N801', # leave to us class naming
    'N802', # leave to us method naming
    'N806', # leave to us var naming
    'N811', # leave to us var naming
    'N814', # leave to us var naming
    'N818', # leave to us exceptions naming
    'S101', # assert is fine
    'S102', # exec is fine
    'S104', # leave to us security
    'S105', # leave to us security
    'S106', # leave to us security
    'S107', # leave to us security
    'S110', # pass on exceptions is fine
    'S301', # leave to us security
    'S307', # leave to us security
    'S324', # leave to us security
]
mccabe = { max-complexity = 44 }

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
known-first-party = ['punkasgi', 'tests']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['B017', 'B018', 'E711', 'E712', 'E741', 'F841', 'N803', 'S108', 'S110', 'S501']
